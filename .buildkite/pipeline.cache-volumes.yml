steps:
  - label: ":nodejs: Backstage dependencies with a cache volume"
    key: backstage-dependencies
    command: bash .buildkite/steps/backstage-cache-benchmark.sh volumes
    agents:
      queue: agent-cache-benchmark
    concurrency: 1
    concurrency_group: "cache-benchmark/${BUILDKITE_PIPELINE_SLUG}"
    timeout_in_minutes: 20
    cache:
      name: "backstage-node-modules-${BUILDKITE_COMMIT}"
      size: 20g
      paths:
        - "$HOME/.backstage-node-modules"
    artifact_paths: "cache-benchmark-results/*"
