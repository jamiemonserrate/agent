steps:
  - label: ":golang: Go agent with cache-volume integrity verification"
    key: go-cache-integrity
    command: bash .buildkite/steps/cache-benchmark.sh volumes
    agents:
      queue: agent-cache-benchmark
    concurrency: 1
    concurrency_group: "cache-benchmark/${BUILDKITE_PIPELINE_SLUG}"
    timeout_in_minutes: 20
    cache:
      name: "go-integrity-${BUILDKITE_COMMIT}"
      size: 20g
      paths:
        - "$HOME/.gocache-target"
        - "$HOME/.gomodcache"
        - "$HOME/.agent-cache-benchmark"
    artifact_paths: "cache-benchmark-results/*"
