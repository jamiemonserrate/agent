steps:
  - label: ":nodejs: Backstage dependencies with Buildkite Cache"
    key: backstage-dependencies
    command: bash .buildkite/steps/backstage-cache-benchmark.sh buildkite-cache
    agents:
      queue: agent-cache-benchmark
    concurrency: 1
    concurrency_group: "cache-benchmark/${BUILDKITE_PIPELINE_SLUG}"
    timeout_in_minutes: 20
    artifact_paths: "cache-benchmark-results/*"
